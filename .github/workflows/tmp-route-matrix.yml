name: temporary route matrix test

on:
  push:
    branches:
      - tmp-route-matrix-test-20261004

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run 368x368 motorcycle flat-road matrix
        shell: python
        run: |
          import json, math, time, urllib.request, urllib.error
          
          RAW = "https://gist.githubusercontent.com/memochou1993/aa9b6b1185221f88a03109f10d32e5e2/raw/"
          # The gist filename is encoded by GitHub; using the gist's API avoids filename encoding issues.
          gist_url = "https://api.github.com/gists/aa9b6b1185221f88a03109f10d32e5e2"
          req = urllib.request.Request(gist_url, headers={"User-Agent":"RideSky-route-test"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              gist = json.load(resp)
          file_obj = next(iter(gist["files"].values()))
          data = json.loads(file_obj["content"])
          
          points=[]
          for city, towns in data["台灣"].items():
              for town, v in towns.items():
                  if town == "釣魚臺列嶼":
                      continue
                  lat=float(v["latitude"]); lon=float(v["longitude"])
                  if 20 <= lat <= 27 and 118 <= lon <= 123:
                      points.append({"city":city,"town":town,"lat":lat,"lon":lon})
          
          assert len(points)==368, f"expected 368 points, got {len(points)}"
          print(f"POINTS={len(points)}")
          
          # Valhalla's public service documents a 1 request/sec per-user limit.
          # 46x46 blocks give 64 matrix requests and cover every directed pair.
          block=46
          blocks=[points[i:i+block] for i in range(0,len(points),block)]
          failures=[]
          request_count=0
          
          def post_json(url,payload):
              global request_count
              body=json.dumps(payload).encode()
              last=None
              for attempt in range(6):
                  try:
                      request_count += 1
                      req=urllib.request.Request(url, data=body, method="POST",
                          headers={"Content-Type":"application/json","User-Agent":"RideSky-route-test"})
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          return json.load(resp)
                  except Exception as e:
                      last=e
                      print(f"request retry {attempt+1}/6: {e}")
                      time.sleep(max(2, 2**attempt))
              raise last
          
          for si,srcs in enumerate(blocks):
              for ti,tgts in enumerate(blocks):
                  payload={
                      "sources":[{"lat":p["lat"],"lon":p["lon"]} for p in srcs],
                      "targets":[{"lat":p["lat"],"lon":p["lon"]} for p in tgts],
                      "costing":"motorcycle",
                      "costing_options":{"motorcycle":{"use_highways":0,"use_trails":0}},
                      "units":"kilometers"
                  }
                  data2=post_json("https://valhalla1.openstreetmap.de/sources_to_targets",payload)
                  matrix=data2.get("sources_to_targets")
                  if not isinstance(matrix,list):
                      raise RuntimeError("unexpected Valhalla matrix response: "+json.dumps(data2)[:1000])
                  for row_i,row in enumerate(matrix):
                      if not isinstance(row,list):
                          continue
                      for col_i,item in enumerate(row):
                          # Valhalla uses null/empty entries when no path exists.
                          if not item or not math.isfinite(float(item.get("time",float("nan")))):
                              failures.append((srcs[row_i],tgts[col_i]))
                  print(f"block {si+1}/{len(blocks)} x {ti+1}/{len(blocks)}; failures={len(failures)}")
                  time.sleep(1.05)
          
          by_source={}
          by_target={}
          for a,b in failures:
              by_source.setdefault(a["city"]+"｜"+a["town"],0); by_source[a["city"]+"｜"+a["town"]]+=1
              by_target.setdefault(b["city"]+"｜"+b["town"],0); by_target[b["city"]+"｜"+b["town"]]+=1
          
          total=368*367
          print("")
          print("=== RIDESKY 368x368 FLAT-ROAD CONNECTIVITY ===")
          print(f"directed_pairs={total}")
          print(f"failed_pairs={len(failures)}")
          print(f"success_pairs={total-len(failures)}")
          print(f"failure_rate={len(failures)/total:.6%}")
          print("")
          print("=== WORST ORIGINS ===")
          for k,v in sorted(by_source.items(), key=lambda x:x[1], reverse=True)[:50]:
              print(f"{v:4d} failures | {k}")
          print("")
          print("=== WORST DESTINATIONS ===")
          for k,v in sorted(by_target.items(), key=lambda x:x[1], reverse=True)[:50]:
              print(f"{v:4d} failures | {k}")
          
          with open("route-matrix-failures.json","w",encoding="utf-8") as f:
              json.dump({
                  "points":points,
                  "directed_pairs":total,
                  "failed_pairs":len(failures),
                  "success_pairs":total-len(failures),
                  "failure_rate":len(failures)/total,
                  "failures":[{"from":a,"to":b} for a,b in failures],
                  "worst_origins":sorted(by_source.items(),key=lambda x:x[1],reverse=True),
                  "worst_destinations":sorted(by_target.items(),key=lambda x:x[1],reverse=True)
              },f,ensure_ascii=False,indent=2)
